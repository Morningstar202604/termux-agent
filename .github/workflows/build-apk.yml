name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        # GitHub 运行器镜像已自带 Android SDK 且许可已接受。
        # 不再调用 android-actions/setup-android：其默认安装的 "tools" 包
        # 在新版 cmdline-tools 中已被移除，会以 Failed to find package 'tools' 失败。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::未找到 Android SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK"
          ls "$SDK"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        run: bash app/scripts/build_apk.sh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: termux-agent-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish rolling release
        # 仓库没有 tag，softprops/action-gh-release 在 push 事件下必须显式指定 tag_name，
        # 否则报 "GitHub Releases requires a tag"。这里用固定 tag 维护一个「最新构建」发布页。
        # 另需顶层 permissions.contents: write，否则创建发布会被拒（403 Resource not accessible）。
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: "由 build-apk 工作流自动发布的滚动构建（debug keystore 签名）。"
          files: app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: true
          overwrite_files: true
          generate_release_notes: false